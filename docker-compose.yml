x-next-public-build-args: &next-public-build-args
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
  NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
  NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
  NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
  NEXT_PUBLIC_BASE_CHAIN_ID: ${NEXT_PUBLIC_BASE_CHAIN_ID:-}
  NEXT_PUBLIC_VIBECD_TOKEN_ADDRESS: ${NEXT_PUBLIC_VIBECD_TOKEN_ADDRESS:-}
  NEXT_PUBLIC_VIBECD_CLAIM_ADDRESS: ${NEXT_PUBLIC_VIBECD_CLAIM_ADDRESS:-}
  NEXT_PUBLIC_VIBECD_REWARDS_ADDRESS: ${NEXT_PUBLIC_VIBECD_REWARDS_ADDRESS:-}
  NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
  NEXT_PUBLIC_BASE_RPC_URL: ${NEXT_PUBLIC_BASE_RPC_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
      POSTGRES_DB: vibecodingdiscover
    # No host port: web/worker use the compose network (postgres:5432).
    # Local host tools: add docker-compose.override.yml with
    #   ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibecodingdiscover"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args: *next-public-build-args
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vibe:vibe@postgres:5432/vibecodingdiscover
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm start"
    profiles: ["app"]

  worker:
    build:
      context: .
      args: *next-public-build-args
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vibe:vibe@postgres:5432/vibecodingdiscover
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run worker
    profiles: ["app"]

volumes:
  pgdata:
