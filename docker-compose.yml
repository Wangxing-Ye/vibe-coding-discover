services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
      POSTGRES_DB: vibecodingdiscover
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibecodingdiscover"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vibe:vibe@postgres:5432/vibecodingdiscover
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm start"
    profiles: ["app"]

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vibe:vibe@postgres:5432/vibecodingdiscover
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run worker
    profiles: ["app"]

volumes:
  pgdata:
